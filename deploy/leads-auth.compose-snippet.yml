# Proposed addition to dayo-internal-services/stacks/sso/docker-compose.yml (NOT applied).
# leads-auth is the only container on both proxy and leads-front, so it is the only way to leads:8000.
# Needs: a new Entra app registration "Leads" with redirect https://leads.dayo-tech.com/oauth2/callback,
# app roles leads_viewer / leads_editor, and leads-auth.env (issuer URL, client id/secret, cookie secret).
  leads-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: leads-auth
    restart: unless-stopped
    env_file: leads-auth.env   # issuer URL, client id/secret, cookie secret
    environment:
      OAUTH2_PROXY_PROVIDER: entra-id
      OAUTH2_PROXY_REDIRECT_URL: https://leads.dayo-tech.com/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://leads:8000
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: dayo-tech.com
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: roles            # Entra app roles -> X-Forwarded-Groups
      OAUTH2_PROXY_ALLOWED_GROUPS: leads_viewer,leads_editor
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: _leads_auth
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
    networks: [proxy, leads-front]
    labels:
      caddy: leads.dayo-tech.com
      caddy.reverse_proxy: "{{upstreams 4180}}"

# and at the bottom of that file:
